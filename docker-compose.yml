# V-RSS 一键部署（Docker Compose，推荐）
# 使用方法：
#   1. 修改下方 AUTH_CODE / DEEPSEEK_API_KEY / SERVER_ORIGIN_URL
#   2. docker compose up -d --build
#   3. 访问 http://localhost:4000/dash
services:
  app:
    build: .
    container_name: vrss
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # 访问授权码（重要：改成你自己的密码！）
      AUTH_CODE: changeme
      # 服务端访问地址：部署到服务器后改成公网域名/IP，用于生成完整 RSS 链接
      SERVER_ORIGIN_URL: http://localhost:4000
      # 数据库类型（保持 sqlite）
      DATABASE_TYPE: sqlite
      DATABASE_URL: "file:../data/vrss.db"
      # RSS 全文模式
      FEED_MODE: fulltext
      # 正文 html 清理
      ENABLE_CLEAN_HTML: "true"
      # AI 分析 API Key（DeepSeek，用于自动打标/雷达报告/学习计划，可选）
      DEEPSEEK_API_KEY: ""
      # 每分钟最大请求次数（防微信封控）
      MAX_REQUEST_PER_MINUTE: 60
    volumes:
      # 数据库 + 抓取的图片等数据持久化（容器重建不丢失）
      - ./data:/app/data
